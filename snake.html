<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Neon Snake</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;700&display=swap');

  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    background: #0a0a0f;
    display: flex;
    justify-content: center;
    align-items: center;
    height: 100vh;
    font-family: 'JetBrains Mono', 'Fira Code', 'Cascadia Code', monospace;
    overflow: hidden;
  }

  /* Dot grid background */
  body::before {
    content: '';
    position: fixed;
    top: 0; left: 0;
    width: 100%; height: 100%;
    background-image: radial-gradient(circle, rgba(0,255,136,0.08) 1px, transparent 1px);
    background-size: 20px 20px;
    pointer-events: none;
    z-index: 0;
  }

  .game-wrapper {
    position: relative;
    z-index: 1;
    text-align: center;
  }

  .score-board {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 12px;
    padding: 0 4px;
  }

  .score-label {
    color: rgba(0,255,136,0.5);
    font-size: 0.75rem;
    text-transform: uppercase;
    letter-spacing: 2px;
  }

  .score-value {
    color: #00ff88;
    font-size: 2rem;
    font-weight: 700;
    text-shadow: 0 0 12px rgba(0,255,136,0.6), 0 0 24px rgba(0,255,136,0.3);
  }

  .high-score {
    text-align: right;
  }

  .high-score .score-value {
    color: rgba(0,255,136,0.4);
    font-size: 1.125rem;
    text-shadow: none;
  }

  .canvas-container {
    position: relative;
  }

  canvas {
    border: 2px solid rgba(0,255,136,0.2);
    box-shadow: 0 0 20px rgba(0,255,136,0.08), 0 0 60px rgba(0,255,136,0.04);
    display: block;
    max-width: 100%;
    height: auto;
  }

  .restart-btn {
    display: block;
    margin: 16px auto 0;
    padding: 10px 32px;
    background: transparent;
    color: #00ff88;
    border: 2px solid rgba(0,255,136,0.4);
    font-family: 'JetBrains Mono', 'Fira Code', monospace;
    font-size: 0.875rem;
    cursor: pointer;
    text-transform: uppercase;
    letter-spacing: 2px;
    transition: all 0.2s;
    opacity: 0;
    pointer-events: none;
  }

  .restart-btn.visible {
    opacity: 1;
    pointer-events: auto;
  }

  .restart-btn:hover {
    background: rgba(0,255,136,0.1);
    border-color: #00ff88;
    box-shadow: 0 0 16px rgba(0,255,136,0.3);
  }

  .controls-hint {
    color: rgba(0,255,136,0.25);
    font-size: 0.75rem;
    margin-top: 12px;
    letter-spacing: 1px;
  }

  .error-message {
    color: #ff4444;
    font-size: 1rem;
    text-align: center;
    padding: 40px;
  }

  /* Death flash */
  @keyframes deathFlash {
    0%, 100% { background: #0a0a0f; }
    50% { background: rgba(255,0,0,0.15); }
  }

  body.dead {
    animation: deathFlash 0.4s ease-out;
  }
</style>
</head>
<body>
<div class="game-wrapper">
  <div class="score-board">
    <div>
      <div class="score-label">Score</div>
      <div class="score-value" id="score">0</div>
    </div>
    <div class="high-score">
      <div class="score-label">Best</div>
      <div class="score-value" id="highScore">0</div>
    </div>
  </div>
  <div class="canvas-container">
    <canvas id="canvas" width="400" height="400"></canvas>
  </div>
  <button class="restart-btn" id="restartBtn">↻ Retry</button>
  <div class="controls-hint">↑↓←→ / WASD / Swipe &nbsp;|&nbsp; Space to Pause</div>
</div>

<script>
(function() {
const canvas = document.getElementById('canvas');
if (!canvas) return;

const ctx = canvas.getContext('2d');
if (!ctx) {
  canvas.insertAdjacentHTML('afterend', '<div class="error-message">Canvas 2D not supported in this browser.</div>');
  return;
}

const scoreEl = document.getElementById('score');
const highScoreEl = document.getElementById('highScore');
const restartBtn = document.getElementById('restartBtn');

const GRID = 20;
const CELL = canvas.width / GRID;
const SPEED = 150;

let snake, food, direction, nextDirection, score, highScore, gameState, timer;

// --- Safe localStorage ---
function loadHighScore() {
  try { return parseInt(localStorage.getItem('neonSnakeHighScore')) || 0; }
  catch(e) { return 0; }
}
function saveHighScore(v) {
  try { localStorage.setItem('neonSnakeHighScore', v); }
  catch(e) { /* silently degrade */ }
}

function checkHighScore() {
  if (score > highScore) {
    highScore = score;
    saveHighScore(highScore);
    highScoreEl.textContent = highScore;
  }
}

// --- Init ---
function init() {
  snake = [
    {x: 10, y: 10},
    {x: 9, y: 10},
    {x: 8, y: 10},
  ];
  direction = {x: 1, y: 0};
  nextDirection = {x: 1, y: 0};
  score = 0;
  gameState = 'playing';
  scoreEl.textContent = '0';
  restartBtn.classList.remove('visible');
  document.body.classList.remove('dead');
  spawnFood();
  if (timer) clearTimeout(timer);
  loop();
}

function spawnFood() {
  const empty = [];
  for (let x = 0; x < GRID; x++) {
    for (let y = 0; y < GRID; y++) {
      if (!snake.some(s => s.x === x && s.y === y)) {
        empty.push({x, y});
      }
    }
  }
  if (empty.length === 0) return false;
  food = empty[Math.floor(Math.random() * empty.length)];
  return true;
}

// --- Game Loop ---
function loop() {
  if (gameState !== 'playing') return;
  update();
  if (gameState !== 'playing') return;
  draw();
  timer = setTimeout(loop, SPEED);
}

function update() {
  direction = nextDirection;
  const head = {x: snake[0].x + direction.x, y: snake[0].y + direction.y};

  // Wall collision
  if (head.x < 0 || head.x >= GRID || head.y < 0 || head.y >= GRID) {
    die();
    return;
  }

  // Check eating BEFORE adding head
  const willEat = (head.x === food.x && head.y === food.y);

  snake.unshift(head);

  if (willEat) {
    score += 10;
    scoreEl.textContent = score;
    if (!spawnFood()) {
      win();
      return;
    }
  } else {
    snake.pop();
  }

  // Self collision AFTER tail removal (avoids false positive on tail cell)
  for (let i = 1; i < snake.length; i++) {
    if (snake[i].x === head.x && snake[i].y === head.y) {
      die();
      return;
    }
  }
}

function die() {
  gameState = 'dead';
  document.body.classList.add('dead');
  restartBtn.classList.add('visible');
  checkHighScore();
  draw();
}

function win() {
  gameState = 'won';
  restartBtn.classList.add('visible');
  checkHighScore();
  draw();
}

// --- Render ---
function draw() {
  ctx.fillStyle = '#0a0a0f';
  ctx.fillRect(0, 0, canvas.width, canvas.height);

  // Grid lines
  ctx.strokeStyle = 'rgba(0,255,136,0.04)';
  ctx.lineWidth = 0.5;
  for (let i = 0; i <= GRID; i++) {
    ctx.beginPath();
    ctx.moveTo(i * CELL, 0);
    ctx.lineTo(i * CELL, canvas.height);
    ctx.stroke();
    ctx.beginPath();
    ctx.moveTo(0, i * CELL);
    ctx.lineTo(canvas.width, i * CELL);
    ctx.stroke();
  }

  // Food (only if set)
  if (food) {
    const fx = food.x * CELL + CELL / 2;
    const fy = food.y * CELL + CELL / 2;
    const pulse = Math.sin(Date.now() / 200) * 2 + 7;

    ctx.shadowColor = '#ff6b35';
    ctx.shadowBlur = 12;
    ctx.fillStyle = '#ff6b35';
    ctx.beginPath();
    ctx.arc(fx, fy, pulse, 0, Math.PI * 2);
    ctx.fill();
    ctx.shadowBlur = 0;
  }

  // Snake
  snake.forEach((seg, i) => {
    const alpha = 1 - (i / (snake.length + 10)) * 0.6;
    const gx = seg.x * CELL;
    const gy = seg.y * CELL;

    ctx.shadowColor = '#00ff88';
    ctx.shadowBlur = i === 0 ? 16 : 6;
    ctx.fillStyle = i === 0
      ? '#00ff88'
      : `rgba(0, 255, 136, ${alpha})`;

    const pad = i === 0 ? 1 : 2;
    ctx.fillRect(gx + pad, gy + pad, CELL - pad * 2, CELL - pad * 2);

    // Head eyes (positions computed from CELL)
    if (i === 0) {
      ctx.shadowBlur = 0;
      ctx.fillStyle = '#0a0a0f';
      const er = CELL * 0.125; // eye radius = 2.5px @ CELL=20
      if (direction.x === 1) {
        ctx.beginPath(); ctx.arc(gx + CELL*0.7, gy + CELL*0.3, er, 0, Math.PI*2); ctx.fill();
        ctx.beginPath(); ctx.arc(gx + CELL*0.7, gy + CELL*0.7, er, 0, Math.PI*2); ctx.fill();
      } else if (direction.x === -1) {
        ctx.beginPath(); ctx.arc(gx + CELL*0.3, gy + CELL*0.3, er, 0, Math.PI*2); ctx.fill();
        ctx.beginPath(); ctx.arc(gx + CELL*0.3, gy + CELL*0.7, er, 0, Math.PI*2); ctx.fill();
      } else if (direction.y === -1) {
        ctx.beginPath(); ctx.arc(gx + CELL*0.3, gy + CELL*0.3, er, 0, Math.PI*2); ctx.fill();
        ctx.beginPath(); ctx.arc(gx + CELL*0.7, gy + CELL*0.3, er, 0, Math.PI*2); ctx.fill();
      } else {
        ctx.beginPath(); ctx.arc(gx + CELL*0.3, gy + CELL*0.7, er, 0, Math.PI*2); ctx.fill();
        ctx.beginPath(); ctx.arc(gx + CELL*0.7, gy + CELL*0.7, er, 0, Math.PI*2); ctx.fill();
      }
    }
  });
  ctx.shadowBlur = 0;

  // Death overlay
  if (gameState === 'dead') {
    ctx.fillStyle = 'rgba(10,10,15,0.7)';
    ctx.fillRect(0, 0, canvas.width, canvas.height);
    ctx.fillStyle = '#ff4444';
    ctx.font = 'bold 28px "JetBrains Mono", monospace';
    ctx.textAlign = 'center';
    ctx.shadowColor = '#ff4444';
    ctx.shadowBlur = 20;
    ctx.fillText('GAME OVER', canvas.width / 2, canvas.height / 2 - 16);
    ctx.fillStyle = 'rgba(255,255,255,0.7)';
    ctx.font = '16px "JetBrains Mono", monospace';
    ctx.fillText('SCORE: ' + score, canvas.width / 2, canvas.height / 2 + 24);
    ctx.shadowBlur = 0;
    ctx.textAlign = 'start';
  }

  // Pause overlay
  if (gameState === 'paused') {
    ctx.fillStyle = 'rgba(10,10,15,0.6)';
    ctx.fillRect(0, 0, canvas.width, canvas.height);
    ctx.fillStyle = '#ffd700';
    ctx.font = 'bold 28px "JetBrains Mono", monospace';
    ctx.textAlign = 'center';
    ctx.shadowColor = '#ffd700';
    ctx.shadowBlur = 16;
    ctx.fillText('PAUSED', canvas.width / 2, canvas.height / 2);
    ctx.shadowBlur = 0;
    ctx.textAlign = 'start';
  }

  // Win overlay
  if (gameState === 'won') {
    ctx.fillStyle = 'rgba(10,10,15,0.75)';
    ctx.fillRect(0, 0, canvas.width, canvas.height);
    ctx.fillStyle = '#ffd700';
    ctx.font = 'bold 24px "JetBrains Mono", monospace';
    ctx.textAlign = 'center';
    ctx.shadowColor = '#ffd700';
    ctx.shadowBlur = 20;
    ctx.fillText('YOU WIN!', canvas.width / 2, canvas.height / 2 - 12);
    ctx.fillStyle = '#00ff88';
    ctx.font = '16px "JetBrains Mono", monospace';
    ctx.fillText('SCORE: ' + score, canvas.width / 2, canvas.height / 2 + 24);
    ctx.shadowBlur = 0;
    ctx.textAlign = 'start';
  }
}

// --- Input ---
function setDirection(dx, dy) {
  if (gameState !== 'playing') return;
  if (nextDirection.x === -dx && nextDirection.y === -dy) return; // no 180° turn
  if (dx !== 0 && direction.x !== 0) return; // already horizontal
  if (dy !== 0 && direction.y !== 0) return; // already vertical
  nextDirection = {x: dx, y: dy};
}

document.addEventListener('keydown', e => {
  // Always preventDefault for arrow keys to stop page scrolling
  if (['ArrowUp','ArrowDown','ArrowLeft','ArrowRight'].includes(e.key)) {
    e.preventDefault();
  }

  if (e.key === ' ' || e.key === 'Spacebar') {
    e.preventDefault();
    if (gameState === 'playing') {
      if (timer) { clearTimeout(timer); timer = null; }
      gameState = 'paused';
      draw();
      return;
    } else if (gameState === 'paused') {
      gameState = 'playing';
      draw();
      timer = setTimeout(loop, SPEED);
      return;
    }
  }
  if (gameState !== 'playing') return;

  const key = e.key.toLowerCase();
  if (key === 'arrowup'    || key === 'w') setDirection(0, -1);
  if (key === 'arrowdown'  || key === 's') setDirection(0, 1);
  if (key === 'arrowleft'  || key === 'a') setDirection(-1, 0);
  if (key === 'arrowright' || key === 'd') setDirection(1, 0);
});

// Touch/swipe support
let touchStartX = 0, touchStartY = 0;
canvas.addEventListener('touchstart', e => {
  e.preventDefault();
  if (!e.touches.length) return;
  touchStartX = e.touches[0].clientX;
  touchStartY = e.touches[0].clientY;
}, {passive: false});
canvas.addEventListener('touchmove', e => e.preventDefault(), {passive: false});
canvas.addEventListener('touchend', e => {
  if (gameState !== 'playing') return;
  if (!e.changedTouches.length) return;
  const dx = e.changedTouches[0].clientX - touchStartX;
  const dy = e.changedTouches[0].clientY - touchStartY;
  const minSwipe = 15;
  if (Math.abs(dx) < minSwipe && Math.abs(dy) < minSwipe) return;
  if (Math.abs(dx) > Math.abs(dy)) {
    setDirection(dx > 0 ? 1 : -1, 0);
  } else {
    setDirection(0, dy > 0 ? 1 : -1);
  }
});

// Pause on tab blur / visibility change
document.addEventListener('visibilitychange', () => {
  if (document.hidden && gameState === 'playing') {
    if (timer) { clearTimeout(timer); timer = null; }
    gameState = 'paused';
    draw();
  }
});
window.addEventListener('blur', () => {
  if (gameState === 'playing') {
    if (timer) { clearTimeout(timer); timer = null; }
    gameState = 'paused';
    draw();
  }
});

function restart() {
  init();
}
restartBtn.addEventListener('click', restart);

// --- Start ---
highScore = loadHighScore();
highScoreEl.textContent = highScore;
init();
})();
</script>
</body>
</html>
